<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Multi stimuli-responsive polymer DDS의 3차원 단면 구조 — 경구 캡슐, 나노입자, 고분자 사슬의 세 스케일을 회전·확대하며 볼 수 있는 인터랙티브 도식.">
<meta property="og:title" content="Multi stimuli-responsive polymer DDS — 3D 단면 구조">
<meta property="og:description" content="경구 캡슐 · 나노입자 · 고분자 사슬의 세 스케일 인터랙티브 3D 도식">
<meta property="og:type" content="website">
<title>Multi stimuli-responsive polymer DDS — 3D 단면 구조</title>
<style>
  :root{
    --paper:#F7F6F3;
    --ink:#23231F;
    --ink-soft:#65645E;
    --rule:#D8D6CE;
    --panel:#FFFFFF;
    --mark:#1D6B8C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .frame{max-width:1120px;margin:0 auto;padding:28px 24px 40px}
  header{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:18px}
  h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-0.01em}
  header p{margin:5px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.55}
  .stage{display:grid;grid-template-columns:1fr 264px;gap:20px;align-items:start}
  @media(max-width:860px){
    .stage{grid-template-columns:1fr}
    #gl{height:clamp(320px,60vh,460px)}
    .lab{font-size:10.5px;padding:3px 5px}
    .switch button{font-size:11px;padding:8px 4px}
    .frame{padding:20px 16px 32px}
    h1{font-size:17px}
  }
  .viewport{position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:3px;overflow:hidden;min-height:440px}
  #gl{display:block;width:100%;height:520px;touch-action:none}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    font-size:11.5px;line-height:1;padding:4px 7px;border-radius:2px;
    background:rgba(255,255,255,.88);border:1px solid var(--rule);color:var(--ink);
    letter-spacing:-0.01em}
  .lab b{font-weight:600}
  .lab i{font-style:normal;color:var(--ink-soft)}
  .scalebadge{position:absolute;left:14px;top:14px;font-size:11px;color:var(--ink-soft);
    background:rgba(247,246,243,.9);padding:5px 9px;border:1px solid var(--rule);border-radius:2px}
  .hint{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--ink-soft)}
  aside{font-size:12.5px;line-height:1.6}
  .switch{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .switch button{flex:1;border:0;background:var(--panel);color:var(--ink-soft);
    font:inherit;font-size:12px;padding:9px 6px;cursor:pointer;border-right:1px solid var(--rule)}
  .switch button:last-child{border-right:0}
  .switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .key{margin:0 0 16px;padding:0;list-style:none}
  .key li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule)}
  .key li:last-child{border-bottom:0}
  .sw{width:11px;height:11px;border-radius:2px;flex:none;margin-top:3px;border:1px solid rgba(0,0,0,.14)}
  .key strong{display:block;font-weight:600;font-size:12.5px}
  .key span{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:1px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tools button{border:1px solid var(--rule);background:var(--panel);font:inherit;font-size:12px;
    padding:7px 11px;border-radius:3px;cursor:pointer;color:var(--ink)}
  .tools button:hover{background:var(--paper)}
  .tools button:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
  .note{font-size:11.5px;color:var(--ink-soft);line-height:1.65;border-top:1px solid var(--rule);padding-top:12px}
  .note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
  .fallback{padding:24px;font-size:13px;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>Multi stimuli-responsive polymer DDS — 3D 단면 구조</h1>
    <p>경구 캡슐 스케일, 나노입자 스케일의 차이가 커, 두 스케일을 나누어 그렸다. 또한, mPEG-P[Asp-(Hyd-DOX)] 내에 존재하는 사슬의 자세한 구조를 나타내었다. (드래그: 회전, 손가락 두 개: 확대/축소)</p>
  </header>

  <div class="stage">
    <div class="viewport">
      <canvas id="gl"></canvas>
      <div id="labels"></div>
      <div class="scalebadge" id="scalebadge">스케일 1 — 경구 캡슐 단면</div>
      <div class="hint">드래그 = 회전 · 손가락 두 개 = 확대</div>
    </div>

    <aside>
      <div class="switch" role="group" aria-label="스케일 선택">
        <button id="btn-capsule" aria-pressed="true">1 · 캡슐</button>
        <button id="btn-nano" aria-pressed="false">2 · 나노입자</button>
        <button id="btn-chain" aria-pressed="false">3 · 사슬</button>
      </div>

      <ul class="key" id="key"></ul>

      <div class="tools">
        <button id="btn-labels">라벨 끄기</button>
        <button id="btn-spin">자동 회전</button>
        <button id="btn-reset">시점 초기화</button>
        <button id="btn-png">PNG 저장</button>
      </div>

      <p class="note" id="note"></p>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var holder = document.getElementById('gl');
  if (typeof THREE === 'undefined'){
    holder.outerHTML = '<div class="fallback">3D 라이브러리를 불러오지 못했습니다. 인터넷에 연결된 상태에서 이 파일을 브라우저로 다시 열어 주세요.</div>';
    return;
  }

  var C = {
    eudragit:0xB0553D, eudragitPale:0xE9C6B9,
    hpmc:0xD9A02F,     hpmcPale:0xF3DFAF,
    azo:0x6B4FA8,      azoPale:0xC3AEE8, azoDeep:0x45307F,
    np:0x7B3FA6,
    peg:0x4A93D4,      pegPale:0xCBE0F2,
    asp:0xE8973C,      aspPale:0xF7DFC0,
    hyd:0x9B2D8C,
    se:0x12A0A8,
    urog:0xCE4E78, dox:0xB32821, sn38:0x1B7A4A,
    edge:0x3A382F
  };

  var canvas = document.getElementById('gl');
  var labelHost = document.getElementById('labels');
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.localClippingEnabled = true;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);

  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  var key = new THREE.DirectionalLight(0xffffff, 0.62); key.position.set(3,5,6); scene.add(key);
  var fill = new THREE.DirectionalLight(0xffffff, 0.26); fill.position.set(-4,-2,3); scene.add(fill);

  var clip = new THREE.Plane(new THREE.Vector3(0,0,-1), 0);

  function shellMat(color, op){
    return new THREE.MeshPhongMaterial({color:color, transparent:true, opacity:op,
      side:THREE.DoubleSide, depthWrite:false, shininess:24, clippingPlanes:[clip]});
  }
  function faceMat(color, op){
    return new THREE.MeshBasicMaterial({color:color, transparent:(op<1), opacity:op, side:THREE.DoubleSide});
  }

  function capsuleProfile(r,h,seg){
    var p=[],i,a;
    for(i=0;i<=seg;i++){ a=-Math.PI/2+(Math.PI/2)*(i/seg); p.push(new THREE.Vector2(r*Math.cos(a), -h+r*Math.sin(a))); }
    for(i=0;i<=seg;i++){ a=(Math.PI/2)*(i/seg); p.push(new THREE.Vector2(r*Math.cos(a), h+r*Math.sin(a))); }
    return p;
  }
  function capsuleOutline(r,h,seg){
    var p=capsuleProfile(r,h,seg), out=p.slice(), i;
    for(i=p.length-1;i>=0;i--) out.push(new THREE.Vector2(-p[i].x, p[i].y));
    return out;
  }
  function capsuleShell(r,h,color,op){
    var g=new THREE.LatheGeometry(capsuleProfile(r,h,40),64);
    return new THREE.Mesh(g, shellMat(color,op));
  }
  function capsuleFace(rOut,hOut,rIn,hIn,color,op,z){
    var s=new THREE.Shape(); s.setFromPoints(capsuleOutline(rOut,hOut,40));
    if(rIn!==null){ var hole=new THREE.Path(); hole.setFromPoints(capsuleOutline(rIn,hIn,40)); s.holes.push(hole); }
    var m=new THREE.Mesh(new THREE.ShapeGeometry(s), faceMat(color,op));
    m.position.z = z; return m;
  }

  function outlineLoop(pts2, z, color, op, width){
    var v=pts2.map(function(p){return new THREE.Vector3(p.x,p.y,z);});
    var g=new THREE.BufferGeometry().setFromPoints(v);
    return new THREE.LineLoop(g, new THREE.LineBasicMaterial({color:color, transparent:true, opacity:op, linewidth:width||1}));
  }
  function circleLoop(r, z, color, op){
    var pts=[], i;
    for(i=0;i<128;i++){ var a=i/128*Math.PI*2; pts.push(new THREE.Vector2(r*Math.cos(a), r*Math.sin(a))); }
    return outlineLoop(pts, z, color, op);
  }

  function tube(pts,r,mat){
    var c=new THREE.CatmullRomCurve3(pts);
    return new THREE.Mesh(new THREE.TubeGeometry(c, Math.max(10,pts.length*3), r, 8, false), mat);
  }
  var mPegMat  = new THREE.MeshPhongMaterial({color:C.peg,  shininess:16});
  var aspBbMat = new THREE.MeshPhongMaterial({color:C.asp,  shininess:16});
  var hydMat   = new THREE.MeshPhongMaterial({color:C.hyd,  shininess:34});
  var doxMat   = new THREE.MeshPhongMaterial({color:C.dox,  shininess:34});
  var capMat   = new THREE.MeshPhongMaterial({color:0x8C8A82, shininess:20});
  var urogMat  = new THREE.MeshPhongMaterial({color:C.urog, shininess:34});

  /* ---------- scale 1 : oral capsule ---------- */
  var capsuleGroup = new THREE.Group();
  var H = 0.72;
  var r0=1.00, r1=0.945, r2=0.885;
  capsuleGroup.add(capsuleShell(r0,H,C.eudragit,0.30));
  capsuleGroup.add(capsuleShell(r1,H,C.hpmc,0.24));
  capsuleGroup.add(capsuleShell(r2,H,C.azo,0.14));
  capsuleGroup.add(capsuleFace(r0,H,r1,H,C.eudragit,1,0.0));
  capsuleGroup.add(capsuleFace(r1,H,r2,H,C.hpmc,1,0.001));
  capsuleGroup.add(capsuleFace(r2,H,null,null,C.azoPale,1,0.002));
  capsuleGroup.add(outlineLoop(capsuleOutline(r0,H,40), 0.0035, C.edge, 0.55));
  capsuleGroup.add(outlineLoop(capsuleOutline(r1,H,40), 0.0035, C.edge, 0.42));
  capsuleGroup.add(outlineLoop(capsuleOutline(r2,H,40), 0.0035, C.azo,  0.75));

  var meshSeeds=[];
  (function(){
    var g=new THREE.BufferGeometry(), pos=[], i, x, y, N=190;
    for(i=0;i<N;i++){
      x=(Math.random()*2-1)*r2*1.02; y=(Math.random()*2-1)*(H+r2)*1.02;
      var yy=Math.max(-H,Math.min(H,y)), d=Math.sqrt(x*x+(y-yy)*(y-yy));
      if(d>r2*0.985) continue;
      pos.push(x,y,0.004);
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    var pts=new THREE.Points(g, new THREE.PointsMaterial({color:C.azoDeep, size:0.016, sizeAttenuation:true, opacity:0.60, transparent:true}));
    capsuleGroup.add(pts);
  })();

  var npDots=[];
  (function(){
    var placed=0, guard=0;
    var geo=new THREE.CircleGeometry(0.031,16);
    while(placed<26 && guard<900){
      guard++;
      var x=(Math.random()*2-1)*r2*0.92, y=(Math.random()*2-1)*(H+r2)*0.92;
      var yy=Math.max(-H,Math.min(H,y)), d=Math.sqrt(x*x+(y-yy)*(y-yy));
      if(d>r2*0.86) continue;
      var ok=true;
      for(var k=0;k<npDots.length;k++){
        var q=npDots[k];
        if((q[0]-x)*(q[0]-x)+(q[1]-y)*(q[1]-y) < 0.021){ ok=false; break; }
      }
      if(!ok) continue;
      var m=new THREE.Mesh(geo, faceMat(C.asp,1));
      m.position.set(x,y,0.006); capsuleGroup.add(m);
      var ring=new THREE.Mesh(new THREE.RingGeometry(0.033,0.045,18), faceMat(C.peg,0.95));
      ring.position.set(x,y,0.0055); capsuleGroup.add(ring);
      var edge=new THREE.Mesh(new THREE.RingGeometry(0.045,0.053,18), faceMat(C.edge,0.8));
      edge.position.set(x,y,0.0052); capsuleGroup.add(edge);
      npDots.push([x,y]); placed++;
    }
  })();
  scene.add(capsuleGroup);

  /* ---------- scale 2 : nanoparticle ---------- */
  var nanoGroup = new THREE.Group();
  var rCore=0.40, rAsp=0.92, rPeg=1.34;

  nanoGroup.add(new THREE.Mesh(new THREE.SphereGeometry(rAsp,64,48), shellMat(C.asp,0.26)));
  nanoGroup.add(new THREE.Mesh(new THREE.SphereGeometry(rCore,48,36), shellMat(C.sn38,0.55)));

  var faceCore=new THREE.Mesh(new THREE.CircleGeometry(rCore,64), faceMat(C.sn38,1)); faceCore.position.z=0.002;
  var faceAsp=new THREE.Mesh(new THREE.RingGeometry(rCore,rAsp,64), faceMat(C.aspPale,1)); faceAsp.position.z=0.001;
  nanoGroup.add(faceCore, faceAsp);
  nanoGroup.add(circleLoop(rAsp, 0.0035, C.asp, 0.75));
  nanoGroup.add(circleLoop(rCore, 0.0035, C.edge, 0.45));

  (function(){
    function P(a,r){ return new THREE.Vector3(r*Math.cos(a), r*Math.sin(a), 0.010); }
    function flatChain(a, withUrog){
      var pts=[], r;
      pts=[]; for(r=rAsp-0.03; r<=rPeg+1e-6; r+=0.06) pts.push(P(a,r));
      nanoGroup.add(tube(pts,0.026,mPegMat));
      pts=[]; for(r=rCore+0.26; r<=rAsp+0.03+1e-6; r+=0.06) pts.push(P(a,r));
      nanoGroup.add(tube(pts,0.026,aspBbMat));
      var p1=P(a,rCore+0.26), p2=P(a,rCore+0.17);
      nanoGroup.add(tube([p1,p2],0.034,hydMat));
      var dir=p2.clone().sub(p1).normalize();
      var s=new THREE.Mesh(new THREE.SphereGeometry(0.055,18,14), doxMat);
      s.position.copy(p2).addScaledVector(dir,0.085);
      nanoGroup.add(s);
      if(withUrog){
        var t=P(a,rPeg), sp=new THREE.Mesh(new THREE.SphereGeometry(0.050,14,10), urogMat);
        sp.position.copy(t); nanoGroup.add(sp);
      }
    }
    var N=12, i, angs=[];
    for(i=0;i<N;i++){ var aa=i/N*Math.PI*2; angs.push(aa); flatChain(aa, i%3===0); }

    var seMat=new THREE.MeshPhongMaterial({color:C.se, shininess:38});
    for(i=0;i<N;i++){
      var a1=angs[i], a2=angs[(i+1)%N], rr=(i%2)?0.84:0.70;
      var q1=P(a1,rr), q2=P(a2,rr);
      var mid=q1.clone().add(q2).multiplyScalar(0.5);
      var d=q2.clone().sub(q1).normalize();
      var e1=mid.clone().addScaledVector(d,-0.040), e2=mid.clone().addScaledVector(d,0.040);
      nanoGroup.add(tube([q1,e1],0.015,seMat));
      nanoGroup.add(tube([e1,e2],0.019,seMat));
      nanoGroup.add(tube([e2,q2],0.015,seMat));
      var b1=new THREE.Mesh(new THREE.SphereGeometry(0.034,12,10), seMat); b1.position.copy(e1);
      var b2=new THREE.Mesh(new THREE.SphereGeometry(0.034,12,10), seMat); b2.position.copy(e2);
      nanoGroup.add(b1,b2);
    }

    var g2=new THREE.BufferGeometry(), p2=[], a, rr;
    for(i=0;i<130;i++){
      a=Math.random()*Math.PI*2; rr=Math.sqrt(Math.random())*(rCore-0.06);
      p2.push(Math.cos(a)*rr, Math.sin(a)*rr, 0.016);
    }
    g2.setAttribute('position', new THREE.Float32BufferAttribute(p2,3));
    nanoGroup.add(new THREE.Points(g2, new THREE.PointsMaterial({color:0xC7ECD8, size:0.026, transparent:true, opacity:0.95})));
  })();

  var pegMat=mPegMat;
  var urogAnchor=null;
  (function(){
    var made=0, guard=0;
    while(made<52 && guard<4000){
      guard++;
      var u=Math.random()*2-1, th=Math.random()*Math.PI*2, s=Math.sqrt(1-u*u);
      var d=new THREE.Vector3(s*Math.cos(th), u, s*Math.sin(th));
      if(d.z > -0.06) continue;
      var a=d.clone().multiplyScalar(rAsp*0.99);
      var c=d.clone().multiplyScalar(rPeg);
      nanoGroup.add(tube([a,c],0.018,pegMat));
      if(made % 3 === 0){
        var sph=new THREE.Mesh(new THREE.SphereGeometry(0.046,14,10), urogMat);
        sph.position.copy(c); nanoGroup.add(sph);
        if(!urogAnchor || (c.y>urogAnchor.y && c.z<-0.35)) urogAnchor=c.clone();
      }
      made++;
    }
    if(!urogAnchor) urogAnchor=new THREE.Vector3(0,rPeg,-0.3);
  })();
  nanoGroup.visible=false;
  scene.add(nanoGroup);

  /* ---------- scale 3 : polymer prodrug chain ---------- */
  var chainGroup = new THREE.Group();

  function bb(x,yo){ return new THREE.Vector3(x, yo+0.26*Math.sin(x*2.4), 0); }
  var doxAnchor=null, hydAnchor=null;
  function buildChain(yo, isUrog){
    var g=new THREE.Group(), x, pts;
    pts=[]; for(x=-2.40;x<=-0.399;x+=0.055) pts.push(bb(x,yo));
    g.add(tube(pts,0.050,mPegMat));
    var term=pts[0].clone();
    pts=[]; for(x=-0.46;x<=1.401;x+=0.055) pts.push(bb(x,yo));
    g.add(tube(pts,0.050,aspBbMat));

    var a0=bb(1.40,yo), barEnd=a0.clone().add(new THREE.Vector3(0.17,0,0));
    g.add(tube([a0,barEnd],0.038,hydMat));
    var cone=new THREE.Mesh(new THREE.ConeGeometry(0.125,0.25,20), hydMat);
    cone.rotation.z=-Math.PI/2;
    cone.position.copy(barEnd).add(new THREE.Vector3(0.125,0,0));
    g.add(cone);
    var s=new THREE.Mesh(new THREE.SphereGeometry(0.155,20,16), doxMat);
    s.position.copy(barEnd).add(new THREE.Vector3(0.44,0,0));
    g.add(s);

    var cap=new THREE.Mesh(new THREE.SphereGeometry(0.090,16,12), isUrog?urogMat:capMat);
    cap.position.copy(term); g.add(cap);
    if(!isUrog){ doxAnchor=s.position.clone(); hydAnchor=barEnd.clone(); }
    return g;
  }
  chainGroup.add(buildChain(0.80,false));
  chainGroup.add(buildChain(-0.90,true));
  chainGroup.visible=false;
  scene.add(chainGroup);

  /* ---------- labels ---------- */
  var LABELS = {
    capsule:[
      {p:[-0.16, H+r0-0.03, 0], t:'Eudragit FS 30D', s:'장용 코팅 · pH ≥ 7'},
      {p:[-0.62, 0.78, 0], t:'HPMC 캡슐', s:'캡슐 쉘'},
      {p:[0.02, 0.18, 0], t:'Azo polymer 겔', s:'HEMA:MMA 6:1 · BMAAB'},
      {p:[0, -H-r0+0.06, 0], t:'담지된 나노입자', s:'스케일 2 참조'}
    ],
    nano:[
      {p:[0,0,0.02], t:'SN-38', s:'코어 봉입 약물'},
      {p:[0.62,0.70,0.02], t:'P[Asp] 블록', s:'소수성 · 쉘'},
      {p:[-0.82,0.92,0.02], t:'mPEG 블록', s:'친수성 · 코로나'},
      {p:[-0.34,-0.52,0.02], t:'Hyd-DOX', s:'사슬 말단'},
      {p:[0.52,-0.92,0.02], t:'Diselenide', s:'-Se-Se- 가교'},
      {p:[0,0,0], t:'UroG', s:'GC-C 표적 리간드', urog:true, wide:true}
    ],
    chain:[
      {p:[-1.85,2.05,0], t:'methoxy 말단', s:'비반응성', wide:true},
      {p:[-1.60,1.42,0], t:'mPEG 블록', s:'친수성'},
      {p:[0.45,1.95,0], t:'P[Asp] 블록', s:'소수성'},
      {p:[1.66,0.42,0], t:'Hydrazone', s:'산 감응성'},
      {p:[2.25,1.35,0], t:'DOX', s:'접합 약물'},
      {p:[-1.15,-2.05,0], t:'N₃-PEG 사슬', s:'말단에 UroG', wide:true}
    ]
  };
  var labelEls=[];
  function buildLabels(which){
    labelHost.innerHTML=''; labelEls=[];
    var narrow = canvas.clientWidth < 380;
    LABELS[which].filter(function(L){ return !(narrow && L.wide); }).forEach(function(L){
      var el=document.createElement('div'); el.className='lab';
      el.innerHTML='<b>'+L.t+'</b> &nbsp;<i>'+L.s+'</i>';
      labelHost.appendChild(el);
      var v;
      if(L.urog) v=urogAnchor.clone();
      else if(L.hyd) v=hydAnchor.clone().add(new THREE.Vector3(-0.15,0.62,0));
      else if(L.doxc) v=doxAnchor.clone().add(new THREE.Vector3(0.62,0.36,0));
      else v=new THREE.Vector3(L.p[0],L.p[1],L.p[2]);
      labelEls.push({el:el, v:v, t:L.t, s:L.s});
    });
  }

  var KEYS = {
    capsule:[
      [C.eudragit,'Eudragit FS 30D','장용 코팅. 위·소장에서 보호, pH ≥ 7 부근에서 용해'],
      [C.hpmc,'HPMC 캡슐','내용물을 담는 캡슐 쉘'],
      [C.azoPale,'Azo polymer 하이드로겔','단면의 보라색 영역 전체입니다. HEMA : MMA = 6 : 1, 가교제 BMAAB. 대장 azoreductase가 azo 결합을 절단'],
      [C.asp,'담지된 나노입자','주황 중심은 P[Asp] 블록, 파란 테두리는 mPEG 코로나 — 스케일 2에서 확대']
    ],
    nano:[
      [C.urog,'UroG (uroguanylin)','일부 사슬의 PEG 말단에 접합'],
      [null,'mPEG-P[Asp-(Hyd-DOX)]','사슬 한 가닥이 바깥에서 코어까지 이어집니다'],
      [C.peg,'mPEG 블록','바깥 구간. 코로나를 이룹니다',true],
      [C.asp,'P[Asp] 블록','안쪽 구간. 쉘을 이룹니다',true],
      [C.hyd,'Hydrazone 결합','사슬 말단과 DOX 사이',true],
      [C.dox,'DOX','사슬 말단에 공유 접합',true],
      [C.se,'Diselenide 결합','-Se-Se- 코어 가교. GSH 조건에서 절단',],
      [C.sn38,'SN-38','코어에 물리적으로 봉입된 약물']
    ],
    chain:[
      [C.peg,'mPEG 블록','친수성. 자기조립 시 바깥으로 뻗어 코로나가 됩니다'],
      [C.asp,'P[Asp] 블록','소수성. 안쪽으로 뭉쳐 쉘이 됩니다'],
      [C.hyd,'Hydrazone 결합','산성 조건에서 절단되는 연결부'],
      [C.dox,'DOX','공유 접합된 약물. 결합이 끊겨야 방출됩니다'],
      [0x8C8A82,'methoxy 말단','비반응성이라 리간드를 붙일 수 없습니다'],
      [C.urog,'UroG 말단 (아래 사슬)','N₃-PEG로 대체한 사슬에만 접합됩니다']
    ]
  };
  var NOTES = {
    capsule:'단면은 중심면(z = 0)에서 절단한 것입니다. 보라색 영역은 빈 공간이 아니라 azo polymer 하이드로겔입니다. 마이셀은 주황 중심(P[Asp] 블록)과 파란 테두리(mPEG 코로나)로 표시했으며, 개수와 크기 비율은 도식적 표현이고 용량 계산 결과가 아닙니다.',
    nano:'절단면의 사슬은 도식적으로 단순화했습니다 — 12가닥을 직선으로 단순화해 그렸고, 실제 사슬 개수와 DOX 접합 수는 이보다 훨씬 많습니다. 바깥에서부터 mPEG 블록(파랑) → P[Asp] 블록(주황) → hydrazone(자주) → DOX(진홍) 순이며, 이웃 사슬끼리 diselenide(청록)로 가교되어 있습니다. 사슬 자체의 자세한 구조는 3번 탭을 보세요.',
    chain:'위 사슬은 mPEG로 끝나 리간드를 붙일 수 없고, 아래 사슬은 말단을 N₃-PEG로 바꿔 UroG를 접합한 것입니다. 두 종류를 섞어 자기조립하면 혼합 마이셀이 됩니다. DOX 구슬 하나는 도식적 축약이며, 실제 접합 개수는 Asp 반복단위 수와 치환도에 따라 결정됩니다.'
  };
  function buildKey(which){
    var ul=document.getElementById('key'); ul.innerHTML='';
    KEYS[which].forEach(function(row){
      var li=document.createElement('li');
      var sw = row[0]===null
        ? '<span class="sw" style="background:transparent;border:0"></span>'
        : '<span class="sw" style="background:#'+row[0].toString(16).padStart(6,'0')+'"></span>';
      li.innerHTML=sw+'<span><strong>'+row[1]+'</strong><span>'+row[2]+'</span></span>';
      if(row[3]) li.style.paddingLeft='17px';
      ul.appendChild(li);
    });
    document.getElementById('note').textContent=NOTES[which];
  }

  /* ---------- camera orbit ---------- */
  var theta=0.42, phi=1.30, dist=4.0, spin=false;
  function place(){
    camera.position.set(dist*Math.sin(phi)*Math.sin(theta), dist*Math.cos(phi), dist*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(0,0,0);
  }
  function clampDist(d){
    var f=fitDist(current);
    return Math.max(Math.max(1.6, f*0.30), Math.min(f*1.80, d));
  }
  var pts={}, nPts=0, lx=0, ly=0, pinch=0;
  function spread(){
    var k=Object.keys(pts);
    if(k.length<2) return 0;
    var a=pts[k[0]], b=pts[k[1]];
    return Math.hypot(a.x-b.x, a.y-b.y);
  }
  canvas.addEventListener('pointerdown',function(e){
    if(pts[e.pointerId]) return;
    pts[e.pointerId]={x:e.clientX,y:e.clientY}; nPts++;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    if(nPts===1){ lx=e.clientX; ly=e.clientY; }
    else if(nPts===2){ pinch=spread(); }
  });
  canvas.addEventListener('pointermove',function(e){
    if(!pts[e.pointerId]) return;
    e.preventDefault();
    pts[e.pointerId].x=e.clientX; pts[e.pointerId].y=e.clientY;
    if(nPts>=2){
      var s=spread();
      if(pinch>0 && s>0) dist=clampDist(dist*(pinch/s));
      pinch=s;
      return;
    }
    theta -= (e.clientX-lx)*0.006;
    phi = Math.max(0.22, Math.min(2.92, phi-(e.clientY-ly)*0.006));
    lx=e.clientX; ly=e.clientY;
  },{passive:false});
  function endPointer(e){
    if(!pts[e.pointerId]) return;
    delete pts[e.pointerId]; nPts=Math.max(0,nPts-1);
    pinch=0;
    var k=Object.keys(pts);
    if(k.length===1){ lx=pts[k[0]].x; ly=pts[k[0]].y; }
  }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('wheel',function(e){e.preventDefault();dist=clampDist(dist+e.deltaY*0.0028);},{passive:false});

  function resize(){
    var w=canvas.clientWidth, h=canvas.clientHeight;
    if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){
      renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
      dist=fitDist(current);
      var nw=(w<380);
      if(nw!==wasNarrow){ wasNarrow=nw; buildLabels(current); }
    }
  }
  var labelsOn = true, wasNarrow = null;
  var pv=new THREE.Vector3();
  function syncLabels(){
    var w=canvas.clientWidth, h=canvas.clientHeight;
    labelEls.forEach(function(L){
      if(!labelsOn){ L.el.style.display='none'; return; }
      pv.copy(L.v).project(camera);
      if(pv.z>1){ L.el.style.display='none'; return; }
      L.el.style.display='block';
      L.el.style.left=((pv.x*0.5+0.5)*w)+'px';
      L.el.style.top=((-pv.y*0.5+0.5)*h)+'px';
    });
  }
  function loop(){
    resize();
    if(spin) theta+=0.0038;
    place(); renderer.render(scene,camera); syncLabels();
    requestAnimationFrame(loop);
  }

  /* ---------- UI ---------- */
  var current='capsule';
  var VIEW={capsule:{d:4.0,t:0.42,p:1.30}, nano:{d:5.1,t:0.30,p:1.36}, chain:{d:6.7,t:0.05,p:1.55}};
  var REQ={capsule:{w:1.15,h:1.85}, nano:{w:1.75,h:1.70}, chain:{w:3.15,h:2.35}};
  function fitDist(which){
    var t=Math.tan(camera.fov*Math.PI/360),
        aspect=Math.max(0.4, canvas.clientWidth/Math.max(1,canvas.clientHeight)),
        r=REQ[which];
    return Math.max(VIEW[which].d, r.w/(t*aspect), r.h/t);
  }
  function show(which){
    current=which;
    capsuleGroup.visible=(which==='capsule');
    nanoGroup.visible=(which==='nano');
    chainGroup.visible=(which==='chain');
    document.getElementById('btn-capsule').setAttribute('aria-pressed', which==='capsule');
    document.getElementById('btn-nano').setAttribute('aria-pressed', which==='nano');
    document.getElementById('btn-chain').setAttribute('aria-pressed', which==='chain');
    document.getElementById('scalebadge').textContent =
      which==='capsule' ? '스케일 1 — 경구 캡슐 단면'
      : which==='nano'  ? '스케일 2 — 나노입자 단면'
      : '스케일 3 — 고분자 사슬';
    theta=VIEW[which].t; phi=VIEW[which].p; dist=fitDist(which);
    buildKey(which); buildLabels(which);
  }
  document.getElementById('btn-capsule').onclick=function(){show('capsule');};
  document.getElementById('btn-nano').onclick=function(){show('nano');};
  document.getElementById('btn-chain').onclick=function(){show('chain');};
  document.getElementById('btn-reset').onclick=function(){
    theta=VIEW[current].t; phi=VIEW[current].p; dist=fitDist(current);
  };
  var btnLabels=document.getElementById('btn-labels');
  btnLabels.textContent = labelsOn ? '라벨 끄기' : '라벨 켜기';
  btnLabels.onclick=function(){ labelsOn=!labelsOn; this.textContent = labelsOn ? '라벨 끄기' : '라벨 켜기'; };
  document.getElementById('btn-spin').onclick=function(){spin=!spin;this.textContent=spin?'회전 정지':'자동 회전';};

  document.getElementById('btn-png').onclick=function(){
    var w=canvas.clientWidth, h=canvas.clientHeight, S=2;
    renderer.setSize(w*S,h*S,false); camera.aspect=w/h; camera.updateProjectionMatrix();
    place(); renderer.render(scene,camera);
    var out=document.createElement('canvas'); out.width=w*S; out.height=h*S;
    var ctx=out.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,out.width,out.height);
    ctx.drawImage(renderer.domElement,0,0,out.width,out.height);
    ctx.font='600 '+(11.5*S)+'px "Helvetica Neue","Apple SD Gothic Neo",sans-serif';
    ctx.textBaseline='middle';
    labelEls.forEach(function(L){
      if(!labelsOn) return;
      pv.copy(L.v).project(camera);
      if(pv.z>1) return;
      var x=(pv.x*0.5+0.5)*w*S, y=(-pv.y*0.5+0.5)*h*S;
      var main=L.t+'  ', sub=L.s;
      ctx.font='600 '+(11.5*S)+'px "Helvetica Neue","Apple SD Gothic Neo",sans-serif';
      var w1=ctx.measureText(main).width;
      ctx.font='400 '+(11.5*S)+'px "Helvetica Neue","Apple SD Gothic Neo",sans-serif';
      var w2=ctx.measureText(sub).width;
      var tw=w1+w2, pad=7*S, bw=tw+pad*2, bh=20*S;
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.strokeStyle='#D8D6CE'; ctx.lineWidth=1*S;
      ctx.beginPath(); ctx.rect(x-bw/2,y-bh/2,bw,bh); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#23231F';
      ctx.font='600 '+(11.5*S)+'px "Helvetica Neue","Apple SD Gothic Neo",sans-serif';
      ctx.fillText(main, x-tw/2, y);
      ctx.fillStyle='#65645E';
      ctx.font='400 '+(11.5*S)+'px "Helvetica Neue","Apple SD Gothic Neo",sans-serif';
      ctx.fillText(sub, x-tw/2+w1, y);
    });
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
    var a=document.createElement('a');
    a.download='DDS_'+(current==='capsule'?'capsule':'nanoparticle')+'_3D.png';
    a.href=out.toDataURL('image/png'); a.click();
  };

  show('capsule');
  place();
  loop();
})();
</script>
</body>
</html>
